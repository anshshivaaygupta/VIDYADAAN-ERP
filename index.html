<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VIDYADAAN NGO - Complete School Management ERP</title>
  <link rel="icon" href="public/logo.png" type="image/png">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lamaSky: '#C3EBFA',
            lamaSkyLight: '#EDF9FD',
            lamaPurple: '#CFCEFF',
            lamaPurpleLight: '#F1F0FF',
            lamaYellow: '#FAE27C',
            lamaYellowLight: '#FEFCE8',
          }
        }
      }
    }
  </script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- React 18 & HTM -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Print Stylesheet for Official Documents */
    @media print {
      body { background: #fff !important; color: #000 !important; margin: 0; padding: 0; }
      .no-print, header, nav, aside, .sidebar-container, .topbar-container, button.no-print {
        display: none !important;
      }
      .print-area {
        position: static !important;
        display: block !important;
        width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      .page-break { page-break-after: always; }
    }
  </style>
</head>
<body class="bg-[#F7F8FA] text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo, useRef } = React;
    const html = htm.bind(React.createElement);
    const STORAGE_KEY = 'vidyadaan_ngo_complete_erp_v3';

    // Normalize Date helper
    const normDob = (s) => {
      s = String(s || '').trim();
      let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
      if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
      m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
      return m ? `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : s;
    };

    // CBSE 9-Point Grading Scale Calculator
    const getCbseGrade = (marks, max = 100) => {
      if (marks === null || marks === undefined || marks === '' || isNaN(marks)) {
        return { grade: '-', gp: '-', desc: 'Pending' };
      }
      const p = (marks / max) * 100;
      if (p >= 91) return { grade: 'A1', gp: '10.0', desc: 'Outstanding' };
      if (p >= 81) return { grade: 'A2', gp: '9.0', desc: 'Excellent' };
      if (p >= 71) return { grade: 'B1', gp: '8.0', desc: 'Very Good' };
      if (p >= 61) return { grade: 'B2', gp: '7.0', desc: 'Good' };
      if (p >= 51) return { grade: 'C1', gp: '6.0', desc: 'Fair' };
      if (p >= 41) return { grade: 'C2', gp: '5.0', desc: 'Average' };
      if (p >= 33) return { grade: 'D', gp: '4.0', desc: 'Passed' };
      if (p >= 21) return { grade: 'E1', gp: '0.0', desc: 'Needs Improvement' };
      return { grade: 'E2', gp: '0.0', desc: 'Failed' };
    };

    // Clean initial state (Zero Demo Data!)
    const getCleanState = () => ({
      ngo: {
        name: 'VIDYADAAN NGO (विद्यादान)',
        tagline: 'Empowering Underprivileged Children through 100% Free & Quality Education',
        regNo: 'NGO/DL/2021/049182',
        centerName: 'Vidyadaan Learning Center',
        address: 'Sector 12, Institutional Area, New Delhi - 110001',
        phone: '+91 98765 43210',
        email: 'contact@vidyadaan.org',
        session: '2025-26',
        centerHead: 'Director / Project Head',
        curriculum: 'CBSE Aligned Holistic Curriculum'
      },
      classes: [
        { id: 1, name: 'Class 10', section: 'A', capacity: 30 },
        { id: 2, name: 'Class 9', section: 'A', capacity: 30 },
        { id: 3, name: 'Class 8', section: 'A', capacity: 30 },
        { id: 4, name: 'Class 7', section: 'A', capacity: 30 },
        { id: 5, name: 'Class 6', section: 'A', capacity: 30 },
        { id: 6, name: 'Class 5', section: 'A', capacity: 30 }
      ],
      subjects: [
        { id: 101, n: 'English Communicative', code: '101', max: 100, pass: 33 },
        { id: 102, n: 'Hindi Course-A', code: '002', max: 100, pass: 33 },
        { id: 103, n: 'Mathematics Standard', code: '041', max: 100, pass: 33 },
        { id: 104, n: 'Science & Environment', code: '086', max: 100, pass: 33 },
        { id: 105, n: 'Social Science', code: '087', max: 100, pass: 33 },
        { id: 106, n: 'Computer / Digital Literacy', code: '402', max: 100, pass: 33 }
      ],
      // Completely empty data
      students: [],
      teachers: [],
      parents: [],
      lessons: [],
      exams: [
        { id: 1, title: 'Annual Evaluation Examination 2026', date: '2026-03-15', cid: 1 }
      ],
      assignments: [],
      announcements: [
        { id: 1, title: 'Welcome to Vidyadaan Free Learning Center', date: '2026-04-01', desc: '100% Free educational materials and books distributed to all enrolled students.' }
      ],
      events: [
        { id: 1, title: 'Science Exhibition & Fair', date: '2026-10-25', time: '10:00 AM - 01:00 PM', desc: 'Hands-on scientific project demonstrations by students.' }
      ],
      marks: {},
      coScholastic: {},
      attendance: {},
      nid: 20
    });

    const loadState = () => {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
        return getCleanState();
      } catch (e) {
        return getCleanState();
      }
    };

    // Shared Reusable Card Component
    const Card = ({ children, className = '' }) => html`
      <div className=${'bg-white rounded-2xl border border-slate-100 shadow-sm p-5 ' + className}>
        ${children}
      </div>
    `;

    // Shared Reusable Metric Card (Lama Dev Style)
    const UserCard = ({ type, count, label, bgClass }) => {
      const icons = {
        student: 'public/student.png',
        teacher: 'public/teacher.png',
        parent: 'public/parent.png',
        class: 'public/class.png'
      };
      return html`
        <div className=${`rounded-2xl p-4 flex-1 min-w-[130px] ${bgClass} shadow-sm`}>
          <div className="flex justify-between items-center">
            <span className="text-[10px] bg-white px-2 py-1 rounded-full text-slate-700 font-bold">2025/26</span>
            <img src=${icons[type] || 'public/more.png'} alt="" className="w-5 h-5 opacity-70" onError=${e => e.target.style.display='none'}/>
          </div>
          <h2 className="text-2xl font-bold my-3 text-slate-900">${count}</h2>
          <h3 className="capitalize text-xs font-semibold text-slate-600">${label}</h3>
        </div>
      `;
    };

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      const [S, setS] = useState(loadState);
      const [role, setRole] = useState('admin'); // 'admin', 'teacher', 'public'
      const [view, setView] = useState('dashboard'); // 'dashboard', 'teachers', 'students', 'classes', 'subjects', 'results', 'attendance', 'assignments', 'announcements', 'events', 'tc_studio', 'settings'
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [activeModal, setActiveModal] = useState(null); // 'student_form', 'report_card', 'tc', 'id_card', 'event_form', 'announcement_form'
      const [modalData, setModalData] = useState(null);
      const [toast, setToast] = useState(null);

      // Save to localStorage automatically
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
        } catch (e) {
          console.warn('Storage error:', e);
        }
      }, [S]);

      const notify = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      const set = (updater) => {
        setS((prev) => ({
          ...prev,
          ...(typeof updater === 'function' ? updater(prev) : updater)
        }));
      };

      // Menu structure inspired by the top GitHub School ERP
      const menuItems = [
        {
          title: 'MENU',
          items: [
            { id: 'dashboard', label: 'Dashboard', icon: 'public/home.png', fa: 'fa-house' },
            { id: 'students', label: 'Students (SIS)', icon: 'public/student.png', fa: 'fa-user-graduate' },
            { id: 'teachers', label: 'Volunteers / Teachers', icon: 'public/teacher.png', fa: 'fa-chalkboard-user' },
            { id: 'classes', label: 'Classes & Sections', icon: 'public/class.png', fa: 'fa-school' },
            { id: 'subjects', label: 'Subjects', icon: 'public/subject.png', fa: 'fa-book-open' },
            { id: 'results', label: 'Evaluation & Results', icon: 'public/result.png', fa: 'fa-square-poll-vertical' },
            { id: 'attendance', label: 'Attendance Register', icon: 'public/attendance.png', fa: 'fa-clipboard-user' },
            { id: 'assignments', label: 'Homework / Tasks', icon: 'public/assignment.png', fa: 'fa-book' },
            { id: 'events', label: 'Events Calendar', icon: 'public/calendar.png', fa: 'fa-calendar-days' },
            { id: 'announcements', label: 'Notice Board', icon: 'public/announcement.png', fa: 'fa-bullhorn' },
            { id: 'tc_studio', label: 'TC & ID Card Studio', icon: 'public/exam.png', fa: 'fa-id-card' }
          ]
        },
        {
          title: 'OTHER',
          items: [
            { id: 'public_portal', label: 'Public Result Portal', icon: 'public/view.png', fa: 'fa-globe' },
            { id: 'settings', label: 'NGO Settings & Backup', icon: 'public/setting.png', fa: 'fa-sliders' }
          ]
        }
      ];

      return html`
        <div className="flex h-screen overflow-hidden">
          <!-- Notification Toast -->
          ${toast && html`
            <div className="fixed top-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl text-xs font-bold text-white transition-all transform animate-bounce ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}">
              <i className=${toast.type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check'}></i>
              <span>${toast.msg}</span>
              <button onClick=${() => setToast(null)} className="ml-2 hover:opacity-75"><i className="fa-solid fa-xmark"></i></button>
            </div>
          `}

          <!-- Sidebar (Top GitHub School ERP Style) -->
          <aside className=${`sidebar-container fixed inset-y-0 left-0 z-40 w-[14%] min-w-[230px] bg-white border-r border-slate-100 flex flex-col transition-transform duration-200 md:static md:translate-x-0 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
            <!-- Logo & Brand Header -->
            <div className="h-16 px-4 flex items-center justify-between border-b border-slate-100">
              <div className="flex items-center gap-2.5">
                <img src="public/logo.png" alt="logo" className="w-8 h-8 rounded-lg" onError=${e => { e.target.onerror=null; e.target.src='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%2310B981"/><text x="50" y="65" font-size="45" text-anchor="middle" fill="white">V</text></svg>'; }}/>
                <div>
                  <h1 className="font-extrabold text-sm text-slate-800 leading-none">VIDYADAAN</h1>
                  <span className="text-[10px] text-emerald-600 font-bold uppercase tracking-wider">Free School ERP</span>
                </div>
              </div>
              <button onClick=${() => setSidebarOpen(false)} className="md:hidden text-slate-400 hover:text-slate-600">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <!-- Role Selector -->
            <div className="p-3 border-b border-slate-100 bg-slate-50/70">
              <div className="text-[9px] font-black uppercase tracking-wider text-slate-400 mb-1 px-1">Role Switcher</div>
              <div className="grid grid-cols-3 gap-1 bg-slate-200/70 p-1 rounded-xl text-center text-[11px] font-bold">
                <button
                  onClick=${() => { setRole('admin'); setSidebarOpen(false); }}
                  className=${`py-1 rounded-lg transition ${role === 'admin' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                >
                  Admin
                </button>
                <button
                  onClick=${() => { setRole('teacher'); setView('results'); setSidebarOpen(false); }}
                  className=${`py-1 rounded-lg transition ${role === 'teacher' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                >
                  Teacher
                </button>
                <button
                  onClick=${() => { setRole('public'); setView('public_portal'); setSidebarOpen(false); }}
                  className=${`py-1 rounded-lg transition ${role === 'public' ? 'bg-white text-amber-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                >
                  Public
                </button>
              </div>
            </div>

            <!-- Scrollable Nav Items -->
            <nav className="flex-1 overflow-y-auto p-3 space-y-4">
              ${menuItems.map(sec => html`
                <div key=${sec.title} className="space-y-1">
                  <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-2 mb-1">${sec.title}</div>
                  ${sec.items.map(item => {
                    const active = view === item.id;
                    return html`
                      <button
                        key=${item.id}
                        onClick=${() => { setView(item.id); setSidebarOpen(false); }}
                        className=${`w-full flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold transition ${
                          active
                            ? 'bg-lamaSky text-slate-900 font-bold shadow-sm'
                            : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'
                        }`}
                      >
                        <img src=${item.icon} alt="" className="w-4 h-4 opacity-75" onError=${e => e.target.style.display='none'}/>
                        <span>${item.label}</span>
                      </button>
                    `;
                  })}
                </div>
              `)}
            </nav>

            <!-- Bottom Badge -->
            <div className="p-3 border-t border-slate-100 bg-slate-50 text-[10px] text-slate-500 flex items-center justify-between">
              <span>Session ${S.ngo.session}</span>
              <span className="font-bold text-emerald-600">● 100% Free NGO</span>
            </div>
          </aside>

          <!-- Main Layout Window -->
          <div className="flex-1 flex flex-col min-w-0 overflow-hidden bg-[#F7F8FA]">
            <!-- Topbar (GitHub ERP Style) -->
            <header className="h-16 bg-white border-b border-slate-100 px-4 md:px-6 flex items-center justify-between gap-4 no-print">
              <div className="flex items-center gap-3">
                <button
                  onClick=${() => setSidebarOpen(!sidebarOpen)}
                  className="md:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100"
                >
                  <i className="fa-solid fa-bars text-lg"></i>
                </button>
                <div>
                  <h2 className="text-base font-bold text-slate-900 leading-none capitalize">
                    ${view.replace('_', ' ')}
                  </h2>
                  <p className="text-xs text-slate-400 mt-1 hidden sm:block">
                    ${S.ngo.name} • ${S.ngo.centerName}
                  </p>
                </div>
              </div>

              <!-- Top Right User Badge -->
              <div className="flex items-center gap-3">
                <span className="hidden sm:inline-block px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-xs font-bold">
                  <i className="fa-solid fa-hand-holding-heart mr-1"></i> Free Education Initiative
                </span>
                <div className="flex items-center gap-2">
                  <div className="w-9 h-9 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center font-bold text-xs text-slate-700">
                    ${role === 'admin' ? 'AD' : role === 'teacher' ? 'TR' : 'PB'}
                  </div>
                  <div className="hidden md:block text-left text-xs leading-tight">
                    <div className="font-bold text-slate-800 capitalize">${role} Portal</div>
                    <div className="text-[10px] text-slate-400">Vidyadaan NGO</div>
                  </div>
                </div>
              </div>
            </header>

            <!-- Scrollable Page Views -->
            <main className="flex-1 overflow-y-auto p-4 md:p-6 pb-24">
              ${view === 'dashboard' && html`<${DashboardView} S=${S} set=${set} setView=${setView} setActiveModal=${setActiveModal} setModalData=${setModalData} notify=${notify}/>`}
              ${view === 'students' && html`<${StudentsView} S=${S} set=${set} setActiveModal=${setActiveModal} setModalData=${setModalData} notify=${notify}/>`}
              ${view === 'teachers' && html`<${TeachersView} S=${S} set=${set} notify=${notify}/>`}
              ${view === 'classes' && html`<${ClassesView} S=${S} set=${set} notify=${notify}/>`}
              ${view === 'subjects' && html`<${SubjectsView} S=${S} set=${set} notify=${notify}/>`}
              ${view === 'results' && html`<${ResultsView} S=${S} set=${set} setActiveModal=${setActiveModal} setModalData=${setModalData} notify=${notify}/>`}
              ${view === 'attendance' && html`<${AttendanceView} S=${S} set=${set} notify=${notify}/>`}
              ${view === 'assignments' && html`<${AssignmentsView} S=${S} set=${set} notify=${notify}/>`}
              ${view === 'events' && html`<${EventsView} S=${S} set=${set} setActiveModal=${setActiveModal} setModalData=${setModalData} notify=${notify}/>`}
              ${view === 'announcements' && html`<${AnnouncementsView} S=${S} set=${set} setActiveModal=${setActiveModal} setModalData=${setModalData} notify=${notify}/>`}
              ${view === 'tc_studio' && html`<${TcStudioView} S=${S} setActiveModal=${setActiveModal} setModalData=${setModalData}/>`}
              ${view === 'public_portal' && html`<${PublicPortalView} S=${S} setActiveModal=${setActiveModal} setModalData=${setModalData}/>`}
              ${view === 'settings' && html`<${SettingsView} S=${S} set=${set} notify=${notify}/>`}
            </main>
          </div>

          <!-- Modals & Printable Templates -->
          ${activeModal === 'student_form' && html`<${StudentFormModal} S=${S} set=${set} student=${modalData} close=${() => setActiveModal(null)} notify=${notify}/>`}
          ${activeModal === 'report_card' && html`<${ReportCardModal} S=${S} student=${modalData} close=${() => setActiveModal(null)}/>`}
          ${activeModal === 'tc' && html`<${TransferCertificateModal} S=${S} student=${modalData} close=${() => setActiveModal(null)}/>`}
          ${activeModal === 'id_card' && html`<${IdCardModal} S=${S} student=${modalData} close=${() => setActiveModal(null)}/>`}
        </div>
      `;
    }

    // ==========================================
    // 1. DASHBOARD VIEW (Lama Dev 4-Card + Chart Layout)
    // ==========================================
    function DashboardView({ S, setView, setActiveModal }) {
      const studentCount = S.students.length;
      const teacherCount = S.teachers.length;
      const classCount = S.classes.length;
      const subjectCount = S.subjects.length;

      return html`
        <div className="space-y-6">
          <!-- Top 4 User Cards -->
          <div className="flex gap-4 justify-between flex-wrap">
            <${UserCard} type="student" count=${studentCount} label="Students Enrolled" bgClass="bg-lamaPurple"/>
            <${UserCard} type="teacher" count=${teacherCount} label="Volunteer Teachers" bgClass="bg-lamaYellow"/>
            <${UserCard} type="class" count=${classCount} label="Classes Configured" bgClass="bg-lamaSky"/>
            <${UserCard} type="parent" count=${subjectCount} label="Curriculum Subjects" bgClass="bg-lamaPurpleLight"/>
          </div>

          <!-- Quick Action Bar -->
          <div className="flex flex-wrap gap-2.5">
            <button
              onClick=${() => setActiveModal('student_form')}
              className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-sm transition flex items-center gap-1.5"
            >
              <i className="fa-solid fa-plus"></i> New Student Admission
            </button>
            <button
              onClick=${() => setView('students')}
              className="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-bold text-xs shadow-sm transition flex items-center gap-1.5"
            >
              <i className="fa-solid fa-file-excel text-emerald-600"></i> Bulk Excel Import
            </button>
            <button
              onClick=${() => setView('results')}
              className="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-bold text-xs shadow-sm transition flex items-center gap-1.5"
            >
              <i className="fa-solid fa-square-poll-vertical text-indigo-600"></i> Enter / Upload Marks
            </button>
            <button
              onClick=${() => setView('tc_studio')}
              className="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-bold text-xs shadow-sm transition flex items-center gap-1.5"
            >
              <i className="fa-solid fa-id-card text-amber-600"></i> Generate TC & ID Cards
            </button>
          </div>

          <!-- Main Dashboard Split: Left Lists & Right Events/Announcements -->
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left: Recent Admissions -->
            <div className="lg:col-span-2 space-y-6">
              <${Card}>
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <img src="public/student.png" className="w-5 h-5"/>
                    <h3 className="text-sm font-bold text-slate-800">Enrolled Students</h3>
                  </div>
                  <button onClick=${() => setView('students')} className="text-xs font-bold text-indigo-600 hover:underline">
                    View All (${studentCount})
                  </button>
                </div>
                <div className="divide-y divide-slate-100 mt-2">
                  ${studentCount ? S.students.slice(0, 5).map(st => {
                    const cl = S.classes.find(c => c.id === st.cid) || { name: 'Class 10 A' };
                    return html`
                      <div key=${st.id} className="py-2.5 flex items-center justify-between text-xs">
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-8 rounded-full bg-lamaSky text-slate-800 flex items-center justify-center font-bold text-xs">
                            ${st.name.charAt(0)}
                          </div>
                          <div>
                            <div className="font-bold text-slate-900">${st.name}</div>
                            <div className="text-[11px] text-slate-400">Roll: ${st.roll} • Adm: ${st.admNo}</div>
                          </div>
                        </div>
                        <span className="px-2.5 py-1 rounded-lg bg-slate-100 font-semibold text-slate-700 text-[11px]">
                          ${cl.name} ${cl.section || ''}
                        </span>
                      </div>
                    `;
                  }) : html`
                    <div className="py-8 text-center text-xs text-slate-400">
                      No students enrolled yet. Click "Bulk Excel Import" or "New Student Admission" to add real records.

    // ==========================================
    // 2. STUDENTS VIEW (FULL CRUD & EXCEL IMPORT/EXPORT)
    // ==========================================
    function StudentsView({ S, set, setActiveModal, setModalData, notify }) {
      const [search, setSearch] = useState('');
      const [filterClass, setFilterClass] = useState('');
      const [csvText, setCsvText] = useState('');

      const filtered = useMemo(() => {
        return S.students.filter(st => {
          const matchClass = filterClass ? String(st.cid) === String(filterClass) : true;
          const q = search.toLowerCase();
          const matchSearch = !q ||
            st.name.toLowerCase().includes(q) ||
            st.roll.toLowerCase().includes(q) ||
            (st.admNo && st.admNo.toLowerCase().includes(q)) ||
            (st.father && st.father.toLowerCase().includes(q)) ||
            (st.phone && st.phone.includes(q));
          return matchClass && matchSearch;
        });
      }, [S.students, search, filterClass]);

      // Download Sample Excel Template
      const downloadSampleTemplate = () => {
        const headers = 'Roll,AdmissionNo,FullName,ClassName,Section,FatherName,MotherName,DOB,Gender,Phone,Category,Address\n';
        const rows = [
          '101,VD-2025-001,Aarav Kumar,Class 10,A,Ramesh Kumar,Sunita Devi,2010-05-14,Male,9876543210,EWS,New Delhi',
          '102,VD-2025-002,Priya Kumari,Class 10,A,Suresh Kumar,Meena Devi,2010-08-02,Female,9876543211,EWS,New Delhi'
        ].join('\n');
        const blob = new Blob([headers + rows], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Vidyadaan_Student_Import_Template.csv';
        a.click();
        notify('Sample Excel/CSV Template downloaded!');
      };

      // Import Students CSV
      const handleCsvImport = () => {
        if (!csvText.trim()) return notify('Paste CSV content or select a file first.', 'error');
        const lines = csvText.split(/\r?\n/).filter(l => l.trim());
        let count = 0;
        let nextNid = S.nid;
        const newStudents = [...S.students];
        const classes = [...S.classes];

        lines.forEach((line, idx) => {
          const parts = line.split(',').map(s => s.trim().replace(/^"|"$/g, ''));
          if (idx === 0 && /roll|admission|name/i.test(parts[0])) return;
          if (parts.length < 3) return;

          const roll = parts[0];
          const admNo = parts[1] || `VD-2025-${String(newStudents.length + 1).padStart(3, '0')}`;
          const name = parts[2];
          const className = parts[3] || 'Class 10';
          const section = parts[4] || 'A';
          const father = parts[5] || '';
          const mother = parts[6] || '';
          const dob = normDob(parts[7] || '2010-01-01');
          const gender = parts[8] || 'Male';
          const phone = parts[9] || '';
          const category = parts[10] || 'EWS';
          const address = parts[11] || '';

          let targetClass = classes.find(c => c.name.toLowerCase() === className.toLowerCase() && (!section || c.section === section));
          if (!targetClass) {
            targetClass = { id: nextNid++, name: className, section: section || 'A' };
            classes.push(targetClass);
          }

          newStudents.push({
            id: nextNid++,
            admNo,
            roll,
            name,
            father,
            mother,
            dob,
            gender,
            cid: targetClass.id,
            phone,
            address,
            bloodGroup: 'B+',
            category
          });
          count++;
        });

        set({ students: newStudents, classes, nid: nextNid });
        setCsvText('');
        notify(`Successfully imported ${count} students!`);
      };

      // Export CSV
      const handleCsvExport = () => {
        if (!S.students.length) return notify('No student records to export.', 'error');
        const headers = ['Roll', 'Admission No', 'Full Name', 'Class', 'Section', 'Father Name', 'Mother Name', 'DOB', 'Gender', 'Phone', 'Category', 'Address'];
        const rows = S.students.map(st => {
          const cl = S.classes.find(c => c.id === st.cid) || { name: 'Class 10', section: 'A' };
          return [
            st.roll, st.admNo, `"${st.name}"`, `"${cl.name}"`, `"${cl.section}"`,
            `"${st.father || ''}"`, `"${st.mother || ''}"`, st.dob, st.gender, st.phone, st.category, `"${st.address || ''}"`
          ].join(',');
        });
        const blob = new Blob([[headers.join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Vidyadaan_Students_${S.ngo.session}.csv`;
        a.click();
      };

      const handleDeleteStudent = (id) => {
        if (confirm('Delete this student record permanently?')) {
          set(p => ({
            students: p.students.filter(s => s.id !== id),
            marks: Object.fromEntries(Object.entries(p.marks).filter(([k]) => !k.startsWith(`${id}|`)))
          }));
          notify('Student record deleted.');
        }
      };

      const handleClearAllStudents = () => {
        if (confirm('CRITICAL: Delete ALL student records? This cannot be undone.')) {
          set(p => ({ students: [], marks: {}, attendance: {} }));
          notify('All student records deleted.');
        }
      };

      return html`
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h3 className="text-lg font-bold text-slate-800">Student Directory (SIS)</h3>
              <p className="text-xs text-slate-500">Student admissions, bulk Excel/CSV import, and official certificate printing.</p>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <button onClick=${downloadSampleTemplate} className="px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-bold text-xs shadow-sm transition">
                <i className="fa-solid fa-file-excel mr-1 text-emerald-600"></i> Sample Excel Template
              </button>
              <button onClick=${handleCsvExport} className="px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-bold text-xs shadow-sm transition">
                <i className="fa-solid fa-file-export mr-1 text-indigo-600"></i> Export CSV
              </button>
              <button onClick=${() => { setActiveModal('student_form'); setModalData(null); }} className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-sm transition">
                <i className="fa-solid fa-plus mr-1"></i> Add Single Student
              </button>
            </div>
          </div>

          <!-- Excel / CSV Bulk Upload Container -->
          <${Card} className="bg-indigo-50/20 border-indigo-100">
            <div className="flex items-center justify-between pb-3 border-b border-indigo-100">
              <h4 className="text-xs font-bold text-slate-800 flex items-center gap-2">
                <img src="public/upload.png" className="w-4 h-4"/>
                <span>Bulk Student Import via Excel / CSV</span>
              </h4>
              <span className="text-[11px] text-slate-500">Upload 100+ students instantly</span>
            </div>
            <div className="mt-3 space-y-3">
              <textarea
                rows="2"
                value=${csvText}
                onInput=${e => setCsvText(e.target.value)}
                placeholder="Paste CSV rows: Roll, AdmissionNo, Full Name, Class, Section, Father Name, Mother Name, DOB (YYYY-MM-DD), Gender, Phone, Category, Address"
                className="w-full p-3 font-mono text-xs rounded-xl border border-slate-200 outline-none focus:border-indigo-500 bg-white"
              ></textarea>
              <div className="flex flex-wrap items-center gap-3">
                <input
                  type="file"
                  accept=".csv,text/csv"
                  onChange=${e => {
                    const f = e.target.files[0];
                    if (!f) return;
                    const r = new FileReader();
                    r.onload = () => setCsvText(String(r.result).replace(/^\uFEFF/, ''));
                    r.readAsText(f);
                    e.target.value = '';
                  }}
                  className="text-xs file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:bg-indigo-100 file:text-indigo-800 file:font-bold hover:file:bg-indigo-200 cursor-pointer"
                />
                <button
                  onClick=${handleCsvImport}
                  className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow transition"
                >
                  <i className="fa-solid fa-cloud-arrow-up mr-1.5"></i> Import Students
                </button>
                ${S.students.length > 0 && html`
                  <button
                    onClick=${handleClearAllStudents}
                    className="ml-auto px-3 py-1.5 rounded-xl border border-red-300 text-red-700 hover:bg-red-50 text-xs font-bold transition"
                  >
                    <i className="fa-solid fa-trash-can mr-1"></i> Clear All Students
                  </button>
                `}
              </div>
            </div>
          <//>

          <!-- Search & Filter Controls -->
          <${Card} className="!p-3">
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div className="sm:col-span-2 relative">
                <i className="fa-solid fa-search absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                <input
                  type="text"
                  placeholder="Search students by name, roll number, admission no, or phone..."
                  value=${search}
                  onInput=${e => setSearch(e.target.value)}
                  className="w-full pl-9 pr-3 py-2 text-xs rounded-xl border border-slate-200 outline-none focus:border-indigo-500"
                />
              </div>
              <div>
                <select
                  value=${filterClass}
                  onChange=${e => setFilterClass(e.target.value)}
                  className="w-full py-2 px-3 text-xs rounded-xl border border-slate-200 outline-none focus:border-indigo-500 bg-white font-medium"
                >
                  <option value="">All Classes (${S.classes.length})</option>
                  ${S.classes.map(c => html`<option key=${c.id} value=${c.id}>${c.name} ${c.section}</option>`)}
                </select>

                <tbody className="divide-y divide-slate-100">
                  ${filtered.length ? filtered.map(st => {

    // ==========================================
    // 6. RESULTS & TEACHER MARKS ENTRY (GRID + BULK CSV)
    // ==========================================
    function ResultsView({ S, set, setActiveModal, setModalData, notify }) {
      const classes = S.classes || [];
      const [cid, setCid] = useState(classes[0]?.id || 1);
      const activeClass = classes.find(c => c.id === Number(cid)) || classes[0];
      const students = useMemo(() => S.students.filter(s => s.cid === activeClass?.id), [S.students, activeClass]);

      const [selectedSubId, setSelectedSubId] = useState(S.subjects[0]?.id || 101);
      const currentSub = S.subjects.find(s => s.id === Number(selectedSubId)) || S.subjects[0];

      const [marksCsv, setMarksCsv] = useState('');

      const handleMarkChange = (studentId, val) => {
        const key = `${studentId}|${currentSub.id}`;
        const num = val === '' ? null : Number(val);
        set(p => ({
          marks: {
            ...p.marks,
            [key]: { ...(p.marks[key] || {}), m: num }
          }
        }));
      };

      // Download Class Marks Template
      const downloadMarksTemplate = () => {
        if (!students.length) return notify('No students enrolled in this class yet.', 'error');
        const headers = 'Roll,AdmissionNo,StudentName,MarksObtained\n';
        const rows = students.map(st => {
          const rec = S.marks[`${st.id}|${currentSub.id}`] || {};
          return `${st.roll},${st.admNo},"${st.name}",${rec.m ?? ''}`;
        }).join('\n');

        const blob = new Blob([headers + rows], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Marks_${activeClass.name}_${currentSub.n}.csv`;
        a.click();
        notify(`Marks CSV template downloaded for ${currentSub.n}!`);
      };

      // Upload Marks from CSV
      const uploadMarksCsv = () => {
        if (!marksCsv.trim()) return notify('Paste marks CSV or select a file.', 'error');
        const lines = marksCsv.split(/\r?\n/).filter(l => l.trim());
        let updatedCount = 0;
        const newMarks = { ...S.marks };

        lines.forEach((line, idx) => {
          const parts = line.split(',').map(s => s.trim().replace(/^"|"$/g, ''));
          if (idx === 0 && /roll|marks|student/i.test(parts[0])) return;
          if (parts.length < 2) return;

          const roll = parts[0];
          const marksVal = parts[3] !== undefined ? parts[3] : parts[1];
          const num = marksVal === '' || isNaN(marksVal) ? null : Number(marksVal);

          const student = students.find(s => s.roll === roll || s.admNo === roll);
          if (student && num !== null) {
            newMarks[`${student.id}|${currentSub.id}`] = { m: num };
            updatedCount++;
          }
        });

        set({ marks: newMarks });
        setMarksCsv('');
        notify(`Uploaded marks for ${updatedCount} students in ${currentSub.n}!`);
      };

      return html`
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h3 className="text-lg font-bold text-slate-800">Academic Evaluation & Marks Entry</h3>
              <p className="text-xs text-slate-500">Record marks, bulk upload scores via CSV, and print CBSE marksheet.</p>
            </div>
            <button
              onClick=${downloadMarksTemplate}
              className="px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-bold text-xs shadow-sm transition"
            >
              <i className="fa-solid fa-file-excel mr-1 text-emerald-600"></i> Download Marks Excel Template
            </button>
          </div>

          <!-- Class & Subject Selector -->
          <${Card} className="!p-4">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
              <div>
                <label className="block font-bold text-slate-600 mb-1">Select Class</label>
                <select
                  value=${cid}
                  onChange=${e => setCid(Number(e.target.value))}
                  className="w-full p-2.5 rounded-xl border border-slate-200 outline-none bg-white font-medium"
                >
                  ${classes.map(c => html`<option key=${c.id} value=${c.id}>${c.name} ${c.section}</option>`)}
                </select>
              </div>

              <div>
                <label className="block font-bold text-slate-600 mb-1">Select Subject</label>
                <select
                  value=${selectedSubId}
                  onChange=${e => setSelectedSubId(Number(e.target.value))}
                  className="w-full p-2.5 rounded-xl border border-slate-200 outline-none bg-white font-medium"
                >
                  ${S.subjects.map(s => html`<option key=${s.id} value=${s.id}>${s.n} (Max: ${s.max})</option>`)}
                </select>
              </div>
            </div>
          <//>

          <!-- Bulk Upload Marks via CSV -->
          <${Card} className="bg-emerald-50/20 border-emerald-100">
            <div className="flex items-center justify-between pb-2 border-b border-emerald-100">
              <h4 className="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                <i className="fa-solid fa-upload text-emerald-600"></i> Upload Marks via Excel / CSV
              </h4>
              <span className="text-[11px] text-slate-500">Format: Roll, Marks (e.g. 101, 85)</span>
            </div>
            <div className="mt-3 flex flex-wrap items-center gap-3">
              <textarea
                rows="1"
                value=${marksCsv}
                onInput=${e => setMarksCsv(e.target.value)}
                placeholder="101, 85\n102, 92"
                className="flex-1 min-w-[200px] p-2 font-mono text-xs rounded-xl border border-slate-200 outline-none bg-white"
              ></textarea>
              <input
                type="file"
                accept=".csv"
                onChange=${e => {
                  const f = e.target.files[0];
                  if (!f) return;
                  const r = new FileReader();
                  r.onload = () => setMarksCsv(String(r.result).replace(/^\uFEFF/, ''));
                  r.readAsText(f);
                  e.target.value = '';
                }}
                className="text-xs file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:bg-emerald-600 file:text-white file:font-bold hover:file:bg-emerald-700 cursor-pointer"
              />
              <button
                onClick=${uploadMarksCsv}
                className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow transition"
              >
                Upload Scores
              </button>
            </div>
          <//>

          <!-- Marks Matrix Table -->
          <${Card} className="!p-0 overflow-hidden">
            <div className="p-3.5 bg-slate-50 border-b border-slate-100 flex justify-between items-center text-xs">
              <span className="font-bold text-slate-800">
                Evaluation Grid: <strong className="text-indigo-600">${currentSub?.n}</strong> (Max: ${currentSub?.max || 100})
              </span>
              <span className="text-slate-500 font-medium">Passing Marks: ${currentSub?.pass || 33}</span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-100 border-b border-slate-200 text-slate-600 font-bold uppercase text-[11px]">
                  <tr>
                    <th className="py-3 px-4">Roll</th>
                    <th className="py-3 px-4">Student Name</th>
                    <th className="py-3 px-4 text-center">Marks (${currentSub?.max})</th>
                    <th className="py-3 px-4 text-center">CBSE Grade</th>
                    <th className="py-3 px-4 text-center">Grade Point</th>
                    <th className="py-3 px-4 text-right">Official Marksheet</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  ${students.length ? students.map(st => {
                    const rec = S.marks[`${st.id}|${currentSub.id}`] || {};
                    const m = rec.m;
                    const gradeInfo = getCbseGrade(m, currentSub.max);

                    return html`
                      <tr key=${st.id} className="hover:bg-slate-50 transition">
                        <td className="py-3 px-4 font-bold text-slate-800">${st.roll}</td>
                        <td className="py-3 px-4 font-semibold text-slate-900">${st.name}</td>
                        <td className="py-3 px-4 text-center">
                          <input
                            type="number"
                            min="0"
                            max=${currentSub.max}
                            value=${m ?? ''}
                            onInput=${e => handleMarkChange(st.id, e.target.value)}
                            placeholder="Marks"
                            className="w-24 p-1.5 text-xs font-bold text-center rounded-lg border border-slate-300 outline-none focus:border-indigo-500"
                          />
                        </td>
                        <td className="py-3 px-4 text-center">
                          <span className=${`font-black px-2 py-0.5 rounded text-xs ${gradeInfo.grade.startsWith('A') ? 'bg-emerald-100 text-emerald-800' : gradeInfo.grade.startsWith('B') ? 'bg-blue-100 text-blue-800' : gradeInfo.grade === 'D' ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800'}`}>
                            ${gradeInfo.grade}
                          </span>
                        </td>
                        <td className="py-3 px-4 text-center font-mono font-bold text-slate-600">${gradeInfo.gp}</td>
                        <td className="py-3 px-4 text-right">
                          <button
                            onClick=${() => { setActiveModal('report_card'); setModalData(st); }}
                            className="px-3 py-1 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-xs transition"
                          >
                            <i className="fa-solid fa-print mr-1"></i> Marksheet
                          </button>
                        </td>
                      </tr>
                    `;
                  }) : html`
                    <tr><td colSpan="6" className="py-10 text-center text-xs text-slate-400">No students enrolled in this class.</td></tr>
                  `}
                </tbody>
              </table>
            </div>
          <//>
        </div>
      `;
    }

    // ==========================================
    // 13. SETTINGS & LOCAL BACKUP VIEW
    // ==========================================
    function SettingsView({ S, set, notify }) {
      const [ngo, setNgo] = useState(S.ngo);

      const saveSettings = (e) => {
        e.preventDefault();
        set({ ngo });
        notify('NGO configuration saved!');
      };

      const exportBackup = () => {
        const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(S, null, 2));
        const a = document.createElement('a');
        a.href = dataStr;
        a.download = `Vidyadaan_NGO_Backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        notify('Backup downloaded!');
      };

      const importBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.ngo && parsed.classes) {
              set(parsed);
              notify('Database restored from JSON!');
            }
          } catch (err) {
            notify('Invalid JSON file.', 'error');
          }
        };
        reader.readAsText(file);
      };

      const clearAllData = () => {
        if (confirm('CRITICAL: Clear entire database to fresh blank state?')) {
          set(getCleanState());
          notify('Database cleared to 100% clean state.');
        }
      };

      return html`
        <div className="max-w-4xl space-y-6">
          <div>
            <h3 className="text-lg font-bold text-slate-800">NGO Profile & Database Administration</h3>
            <p className="text-xs text-slate-500">Configure NGO legal details, center name, and manage local backups.</p>

              <div>
                <label className="block font-bold text-slate-600 mb-1">Registration / Trust Number</label>
                <input
                  type="text"
                  value=${ngo.regNo}
                  onInput=${e => setNgo({ ...ngo, regNo: e.target.value })}
                  className="w-full p-2.5 rounded-xl border border-slate-200 outline-none font-mono"
                />
              </div>

              <div>
                <label className="block font-bold text-slate-600 mb-1">Learning Center Name</label>

                  type="text"
                  value=${ngo.centerName}
                  onInput=${e => setNgo({ ...ngo, centerName: e.target.value })}
                  className="w-full p-2.5 rounded-xl border border-slate-200 outline-none font-bold"

              </div>

              <div className="sm:col-span-2">

                  type="text"
                  value=${ngo.address}
                  onInput=${e => setNgo({ ...ngo, address: e.target.value })}
                  className="w-full p-2.5 rounded-xl border border-slate-200 outline-none"
                />
              </div>

              <div>

              <div>

          <${Card}>

      let totalObtained = 0;
      let passed = true;

        const rec = S.marks[`${student.id}|${sub.id}`] || {};
        const m = rec.m ?? 0;
        totalMax += sub.max;
        totalObtained += m;
        const gradeInfo = getCbseGrade(m, sub.max);
        if (m < sub.pass) passed = false;
        return { sub, m, gradeInfo };
      });

      const percentage = totalMax ? ((totalObtained / totalMax) * 100).toFixed(1) : '0.0';
      const overallGrade = getCbseGrade(Number(percentage), 100);

                  <tbody>
                    ${marksRows.map(row => html`
                      <tr key=${row.sub.id} className="text-center">
                        <td className="border border-slate-400 p-1.5 text-left font-medium">
                          ${row.sub.code ? `[${row.sub.code}] ` : ''}${row.sub.n}

                        <td className="border border-slate-400 p-1.5">${row.sub.max}</td>
                        <td className="border border-slate-400 p-1.5 font-bold">${row.m}</td>

                        <td className="border border-slate-400 p-1.5 font-mono">${row.gradeInfo.gp}</td>

                    <tr className="bg-slate-100 font-bold text-center border-t-2 border-slate-800">

                      <td className="border border-slate-400 p-1.5 font-black">${totalObtained}</td>
                      <td className="border border-slate-400 p-1.5 font-black">${overallGrade.grade}</td>

                  </tbody>
                </table>
              </div>

              <!-- Summary Indicators -->
              <div className="mt-3 grid grid-cols-3 gap-2 text-center text-xs">
                <div className="border border-slate-400 p-1.5 bg-slate-50">
                  <div className="text-[10px] text-slate-500 uppercase font-semibold">Percentage</div>
                  <div className="text-sm font-black text-slate-900">${percentage}%</div>
                </div>
                <div className="border border-slate-400 p-1.5 bg-slate-50">
                  <div className="text-[10px] text-slate-500 uppercase font-semibold">Final Result</div>

                <div className="text-[11px] font-black uppercase tracking-wide bg-slate-800 text-white px-2.5 py-1">

                  <tbody>
                    <tr>

                      <td className="border border-slate-400 p-1 text-center font-bold">${co.workEdu}</td>
                      <td className="border border-slate-400 p-1 text-[11px] text-slate-600">Active participation in creative learning tasks</td>

                    <tr>

                      <td className="border border-slate-400 p-1 text-center font-bold">${co.artEdu}</td>
                      <td className="border border-slate-400 p-1 text-[11px] text-slate-600">Enthusiastic engagement in arts and music</td>
                    </tr>
                    <tr>
                      <td className="border border-slate-400 p-1 font-medium">Health, Sports & Hygiene</td>
                      <td className="border border-slate-400 p-1 text-center font-bold">${co.healthEdu}</td>
                      <td className="border border-slate-400 p-1 text-[11px] text-slate-600">Maintains good health and physical stamina</td>
                    </tr>
                    <tr>
                      <td className="border border-slate-400 p-1 font-medium">Discipline & Moral Values</td>
                      <td className="border border-slate-400 p-1 text-center font-bold">${co.discipline}</td>
                      <td className="border border-slate-400 p-1 text-[11px] text-slate-600">Exemplary respect, attendance and team spirit</td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <!-- Signatures -->
              <div className="mt-8 pt-4 flex justify-between text-xs text-center font-bold text-slate-800">
                <div className="w-40 border-t border-slate-800 pt-1">Volunteer Class Teacher</div>
                <div className="w-40 border-t border-slate-800 pt-1">Evaluation Coordinator</div>
                <div className="w-40 border-t border-slate-800 pt-1">${S.ngo.centerHead}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }
